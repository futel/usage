<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3600">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link href="usage.css" rel="stylesheet">
  <link rel="icon" href="/favicon.ico">
  <title>Futel Usage</title>
  <style>
    /* Fit everything in the viewport; the graphs share the space below the logo. */
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body > .container-fluid {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #graphs {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 600px), 1fr));
      grid-auto-rows: 1fr;
      gap: 1rem;
      padding-bottom: .5rem;
    }
    .graph {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .graph iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <img src="futel_logo_black.png" alt="futel" class="my-2" width=120px/>
    <div id="graphs"></div>
  </div>
  <script>
    // Query strings for each graph. Build a graph in the main UI
    // (index.html), then copy everything after the '?' in its URL here.
    const graphs = [
        'r=-6w&e=incoming-dialstatus-busy-cesar-chavez|incoming-dialstatus-busy-ghost-mountain|incoming-dialstatus-busy-groundscore-one|incoming-dialstatus-completed-cesar-chavez|incoming-dialstatus-completed-ghost-mountain|incoming-dialstatus-completed-groundscore-one|incoming-dialstatus-no-answer-cesar-chavez|incoming-dialstatus-no-answer-demo-one|incoming-dialstatus-no-answer-ghost-mountain|incoming-dialstatus-no-answer-groundscore-one|incoming-dialstatus-no-answer-landline|incoming-dialstatus-no-answer-souwester|internaldial|outgoing-dialstatus-busy|outgoing-dialstatus-completed|outgoing-dialstatus-no-answer&a=weekly&p=ainsworth|alleytwentyseventh|brazee|breckenridge|central|clinton|dome-basement|dome-booth|dome-office|eighth|fiftyeighth|fortysecond|ghost-mountain|groundscore-one|groundscore-two|voipms|twilio-termination|futel.pstn.twilio.com|killingsworth|landline|microcosm|mother-foucaults|princeton|saratoga|seattle-cafered|seattle-estelitas|seattle-fortysecond|seattle-thistle|street-roots-one|sunnyside-shower-project|system|taylor|twilio&chart=bar&t=Good dialstatus',
        'r=-6w&a=weekly&p=ainsworth|alleytwentyseventh|brazee|breckenridge|central|cesar-chavez-one|cesar-chavez-two|clinton|dome-basement|dome-booth|dome-office|eighth|fiftyeighth|fortysecond|ghost-mountain|groundscore-one|groundscore-two|voipms|twilio-termination|futel.pstn.twilio.com|killingsworth|landline|microcosm|mother-foucaults|princeton|saratoga|seattle-cafered|seattle-estelitas|seattle-fortysecond|seattle-thistle|street-roots-one|sunnyside-shower-project|system|taylor|twilio&e=error-11200|error-13224|error-13225|error-13227|error-32009|error-32011|error-32014|error-32017|error-32022|error-32202|incoming-dialstatus-failed-ghost-mountain|outgoing-dialstatus-failed|twilio-error-11200|twilio-error-13224|twilio-error-13225|twilio-error-13227|twilio-error-15003|twilio-error-32009|twilio-error-32011|twilio-error-32014|twilio-error-32017|twilio-error-32022|twilio-error-32102|twilio-error-32106|twilio-error-32202|twilio-error-32207|twilio-error-32222&chart=bar&t=Bad status',
    ];

    const container = document.getElementById('graphs');
    graphs.forEach(query => {
      const div = document.createElement('div');
      div.classList.add('graph');
      const iframe = document.createElement('iframe');
      iframe.src = `index.html?${query}&embed=1`;
      div.appendChild(iframe);
      const link = document.createElement('a');
      link.href = `index.html?${query}`;
      link.classList.add('tinytext');
      link.innerText = 'open in editor';
      div.appendChild(link);
      container.appendChild(div);
    });
  </script>
</body>
</html>
